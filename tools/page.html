<title>{{title}} · {{book}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Commissioner:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column of ~66ch; figures (views, shaping runs, traces)
   break out to a wider measure, because code and buffers need the room. */
:root {
  --paper: #f6f7f9;
  --ink: #1a1e27;
  --muted: #5a6373;
  --rule: #d8dce4;
  --well: #eceff5;
  --accent: #2c48c9;
  --accent-soft: #dfe5fb;
  --hit: #7a4b00;
  --font-text: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-head: "Commissioner", "Helvetica Neue", Arial, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --measure: 620px;
  --wide: 58rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13161d; --ink: #e3e6ed; --muted: #9aa2b1; --rule: #2b313d;
    --well: #1b2029; --accent: #93a6ff; --accent-soft: #252d4a; --hit: #f0c674;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13161d; --ink: #e3e6ed; --muted: #9aa2b1; --rule: #2b313d;
  --well: #1b2029; --accent: #93a6ff; --accent-soft: #252d4a; --hit: #f0c674;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font: 400 1.0625rem/1.65 var(--font-text);
  font-optical-sizing: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper);
}
.page { max-width: var(--wide); margin: 0 auto; display: grid; }
.page > * { width: 100%; min-width: 0; }
.flow { display: grid; min-width: 0; }
.flow > * { width: 100%; max-width: var(--measure); justify-self: start; min-width: 0; }
.flow > .views, .flow > .shape, .flow > .trace, .flow > table { max-width: var(--wide); }
.flow > .macros { max-width: var(--wide); }
.macros table { display: table; table-layout: fixed; font-size: .85rem; }
.macros th:nth-child(1) { width: 25%; }
.macros th:nth-child(2) { width: 35%; }
.macros th:nth-child(3) { width: 17%; }
.macros th:nth-child(4) { width: 23%; }
.macros td:nth-child(1) code { overflow-wrap: anywhere; }
.macros td { overflow-wrap: break-word; }
.flow > .bugs { max-width: var(--wide); }
.bugs table { display: table; table-layout: fixed; font-size: .85rem; }
.bugs th:nth-child(1) { width: 4%; }
.bugs th:nth-child(2) { width: 36%; }
.bugs th:nth-child(3) { width: 20%; }
.bugs th:nth-child(4) { width: 9%; }
.bugs th:nth-child(5) { width: 31%; }
.bugs td { overflow-wrap: break-word; }

/* Top: the book and the HarfBuzz version. */
.masthead {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
  gap: .5rem 1.5rem; padding-block: 1.5rem .75rem;
  border-bottom: 1px solid var(--rule);
  font-family: var(--font-head);
}
.masthead .book { font-weight: 700; letter-spacing: .01em; }
.masthead .book a { color: inherit; text-decoration: none; }
.masthead .sub { color: var(--muted); font-weight: 500; }
.masthead .ver { color: var(--muted); font: 400 .8rem var(--font-code); }
button {
  font: inherit; color: var(--ink); background: none; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 4px; padding: .2rem .6rem;
}
button[aria-selected="true"] {
  background: var(--accent-soft); border-color: var(--accent); color: var(--ink);
}
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details.contents { padding-block: .75rem 0; font: 500 .9rem var(--font-head); }
details.contents summary { cursor: pointer; color: var(--muted); }
/* The whole contents opens at full length (no inner scroll box), in two
   columns where there's room, without splitting a part across them. */
details.contents .toc { padding-bottom: .75rem; columns: 2 20rem; column-gap: 2.5rem; }
details.contents .toc .toc-section { break-inside: avoid; }

/* Contents: in the header, and in full on the title page */
.toc .toc-section { margin-top: .9rem; }
.toc .toc-head { margin: 0 0 .2rem; font: 600 .72rem var(--font-head); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.toc ol { list-style: none; margin: 0; padding: 0; line-height: 1.7; }
.toc li { display: grid; grid-template-columns: 2.2em 1fr; }
.toc li > a { grid-column: 2; }
.toc .num { grid-column: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc li.planned > a { color: var(--muted); }
.toc .summary { grid-column: 2; display: block; margin: -.1rem 0 .5rem; color: var(--muted); font: 400 .92rem/1.45 var(--font-text); }
.toc.full { font: 500 1.05rem var(--font-head); }
.toc.full .toc-section { margin-top: 1.75rem; }
.eyebrow { margin: 2.5rem 0 -1.5rem; font: 600 .78rem var(--font-head); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.planned-note { color: var(--muted); font-style: italic; padding: .75rem 1rem; background: var(--well); border-radius: 6px; }

/* Text */
h1, h2, h3 { font-family: var(--font-head); line-height: 1.2; text-wrap: balance; }
h1 { font-size: 2.6rem; font-weight: 500; letter-spacing: -.01em; margin: 2.5rem 0 1rem; }
h2 { font-size: 1.55rem; font-weight: 600; margin: 2.75rem 0 .5rem; padding-top: .75rem; border-top: 1px solid var(--rule); }
h3 { font-size: 1.15rem; font-weight: 600; margin: 1.75rem 0 .25rem; }
p, ul, ol { margin: 0 0 1rem; }
a { color: var(--accent); text-underline-offset: .15em; }
code { font-family: var(--font-code); font-size: .86em; }
p code, li code, td code { background: var(--well); padding: .05em .3em; border-radius: 3px; }
blockquote {
  margin: 1.25rem 0; padding: .25rem 0 .25rem 1.1rem; border-left: 3px solid var(--accent);
  color: var(--ink);
}
blockquote p:last-child { margin-bottom: 0; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; margin: 0 0 1.25rem; display: block; overflow-x: auto; }
th, td { text-align: left; vertical-align: top; padding: .35rem .75rem .35rem 0; border-bottom: 1px solid var(--rule); }
th { font: 600 .78rem var(--font-head); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
pre { margin: 0; overflow-x: auto; }
pre code { font-size: .82rem; line-height: 1.55; }
.flow > pre { background: var(--well); padding: .9rem 1rem; border-radius: 6px; margin-bottom: 1.25rem; }

/* Figures: views of a lookup */
.views { margin: .5rem 0 1.75rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--well); }
.views .tabs { display: flex; flex-wrap: wrap; gap: .25rem; padding: .5rem; border-bottom: 1px solid var(--rule); font: 500 .8rem var(--font-head); }
.views .pane { padding: .9rem 1rem; }
.views .pane:not(.on) { display: none; }
.views .src { display: inline-block; margin-top: .6rem; font: 400 .78rem var(--font-code); }
.views figcaption { padding: 0 1rem .6rem; color: var(--muted); font: 400 .78rem var(--font-code); }

/* Figures: shaping runs and traces */
.shape, .trace { margin: .5rem 0 1.75rem; overflow-x: auto; }
.shape table, .trace table { display: table; margin: 0; font-size: .85rem; }
.shape td.font, .shape td.opt { font: 400 .78rem var(--font-code); color: var(--muted); white-space: nowrap; }
.shape td.in .txt { display: block; font: 400 1.05rem var(--font-code); }
.shape td.in .cps { display: block; font: 400 .7rem var(--font-code); color: var(--muted); white-space: nowrap; }
.shape td.out code, .trace td.buf code { background: none; padding: 0; white-space: nowrap; color: var(--hit); font-weight: 600; }
.trace { border: 1px solid var(--rule); border-radius: 6px; }
.trace-head { padding: .5rem .75rem; border-bottom: 1px solid var(--rule); background: var(--well); }
.trace-head code { background: none; font-size: .78rem; color: var(--muted); }
.trace td { padding: .3rem .75rem; }
.trace td.what { font: 400 .78rem var(--font-code); white-space: nowrap; color: var(--ink); }
.trace tr:last-child td { border-bottom: 0; }

/* Figures: outlines drawn by hb-vector */
.draw { margin: .5rem 0 1.75rem; border: 1px solid var(--rule); border-radius: 6px; padding: .75rem 1rem .5rem; }
.draw .frames { display: flex; flex-wrap: wrap; gap: 1rem; }
.draw.slider .frames { display: block; }
.draw .frame { flex: 1 1 10rem; min-width: 0; }
.draw .frame[hidden] { display: none; }
.draw svg { display: block; width: 100%; height: auto; max-height: 14rem; color: var(--ink); }
.draw.row svg { max-height: 9rem; }
.draw .frame-label { font: 600 .75rem var(--font-code); color: var(--muted); margin-top: .35rem; }
.draw .frame-shape { display: block; background: none; padding: 0; font-size: .78rem; color: var(--hit); font-weight: 600; white-space: nowrap; overflow-x: auto; }
.draw.slider .frame-label { display: none; }
.draw .control { display: flex; align-items: center; gap: .75rem; margin-top: .6rem; font: 600 .8rem var(--font-code); }
.draw .control input { flex: 1; accent-color: var(--accent); }
.draw .control output { min-width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
.draw figcaption { margin-top: .5rem; color: var(--muted); font: 400 .75rem var(--font-code); }
.draw figcaption code { background: none; padding: 0; }
.ttx pre { padding: .9rem 1rem; max-height: 28rem; overflow: auto; }
.ttx figcaption { padding: .5rem 1rem .6rem; color: var(--muted); font: 400 .78rem var(--font-code); border-top: 1px solid var(--rule); }
.info td.out pre { margin: 0; }
.info td.out code { white-space: pre; }

nav.pager { display: flex; justify-content: space-between; gap: 1rem; padding-top: 2rem; margin-top: 2rem; border-top: 1px solid var(--rule); font: 500 .95rem var(--font-head); }

@media (max-width: 600px) {
  body { font-size: 1rem; }
  h1 { font-size: 2rem; }
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
/* Text for one medium only: the screen hides print-only text, and print
   (the PDF build, or printing a page) hides screen-only text. */
.print-only { display: none !important; }
@media print {
  .screen-only { display: none !important; }
  .print-only { display: revert !important; }
}
/* The two indexes. */
.index .index-letter { margin-top: 1.25rem; }
.index .index-letter h2 { margin: 0 0 .4rem; font-size: 1.1rem; }
.index ul { list-style: none; margin: 0; padding: 0; columns: 2 16rem; column-gap: 2rem; }
.index li { break-inside: avoid; margin: 0 0 .2rem; padding-left: 1.2em; text-indent: -1.2em; line-height: 1.4; }
.index a.loc { font-variant-numeric: tabular-nums; }
.index a.loc.def { font-weight: 700; }
.index .term code { font-size: .9em; }
</style>

<div class="page">
  <header class="masthead">
    <div><span class="book"><a href="title.html">{{book}}</a></span> <span class="sub">{{subtitle}}</span></div>
    <span class="ver">HarfBuzz {{hb_version}}</span>
  </header>
  <details class="contents"><summary>Contents</summary><nav class="toc">{{nav}}</nav></details>
  <main class="flow">
{{body}}
  </main>
  <nav class="pager">{{prev}}{{next}}</nav>
</div>

<script>
(function () {
  // Each lookup's tabs change only that lookup. Every lookup starts on
  // the spec-like view.
  function show(fig, v) {
    var has = fig.querySelector('.pane[data-view="' + v + '"]');
    var s = has ? v : "spec";
    fig.querySelectorAll(".pane").forEach(function (p) { p.classList.toggle("on", p.dataset.view === s); });
    fig.querySelectorAll(".tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.view === s)); });
  }
  document.addEventListener("click", function (e) {
    var tab = e.target.closest(".views .tabs button");
    if (tab) show(tab.closest("figure.views"), tab.dataset.view);
  });
  document.querySelectorAll("figure.views").forEach(function (fig) { show(fig, "spec"); });

  // Sliders on drawings: every frame was drawn when the book was built, so
  // moving the slider shows the nearest one.
  document.querySelectorAll(".draw.slider").forEach(function (fig) {
    var input = fig.querySelector("input[type=range]");
    var out = fig.querySelector("output");
    var frames = Array.prototype.slice.call(fig.querySelectorAll(".frame"));
    input.addEventListener("input", function () {
      var v = Number(input.value), best = frames[0];
      frames.forEach(function (f) {
        if (Math.abs(f.dataset.value - v) < Math.abs(best.dataset.value - v)) best = f;
      });
      frames.forEach(function (f) { f.hidden = f !== best; });
      out.textContent = best.dataset.value;
    });
  });
})();
</script>
